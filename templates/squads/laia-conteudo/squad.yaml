    name: "Pedro Pesquisa"
    icon: "🔍"
    file: agents/pesquisador.agent.md

  - id: angulista
    name: "Ângela Ângulo"
    icon: "🎯"
    file: agents/angulista.agent.md

  - id: ganchista
